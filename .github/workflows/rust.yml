name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # build.rs generates the src/tests/std/*_build.rs fixtures for EVERY
  # alkanes-std-* crate only when some environment variable name contains
  # "ALL" (see the vars_os().position(...contains("ALL")) check). GitHub's
  # hosted images satisfied that by accident (GHCUP_INSTALL_BASE_PREFIX);
  # the RunsOn image does not, which left 9 fixture modules ungenerated
  # (E0583). Set it explicitly so fixture generation is runner-agnostic.
  ALKANES_BUILD_ALL_FIXTURES: "1"

jobs:
  test:
    runs-on: [self-hosted, universe-runners-1]
    strategy:
      matrix:
        test-config:
          - name: "WASM Tests"
            command: "cargo test --target wasm32-unknown-unknown --features test-utils"
          - name: "Protorunes WASM Tests"
            command: "cargo test -p protorune --features test-utils"
          - name: "Protorune Unit Tests"
            command: "cargo test -p protorune --target x86_64-unknown-linux-gnu"
      fail-fast: false # Allows all tests to run even if one fails

    name: ${{ matrix.test-config.name }}
    steps:
      - name: Provide universe host tools
        uses: bitcoinuniverseio/universe-ci-actions/universe-host-tools@ca7d5a2893fd27f41c26f6b62549ccad8b3c46cb
      - uses: actions/checkout@v4
      - name: Authenticate private Universe dependencies
        env:
          UNIVERSE_GITHUB_READ_TOKEN: ${{ secrets.UNIVERSE_GITHUB_READ_TOKEN }}
        run: |
          test -n "${UNIVERSE_GITHUB_READ_TOKEN}"
          # Job-scoped credentials. The file lives in this job's RUNNER_TEMP and
          # git reaches it only through GIT_CONFIG_* variables that this job's
          # later steps inherit (cargo fetches with the git CLI). ~/.gitconfig
          # is never written, so concurrent jobs under the same runner account
          # (including this matrix) neither see this token nor lose their own
          # configuration. Only the file path goes to GITHUB_ENV, never the token.
          umask 077
          # A hard-cancelled earlier job on this runner instance skips the
          # always() cleanup. RUNNER_TEMP belongs to this instance, which runs
          # one job at a time, so anything left here is never a concurrent job's.
          find "${RUNNER_TEMP}" -maxdepth 1 -type f -name 'universe-git-credentials-*' -delete
          credentials_file="${RUNNER_TEMP}/universe-git-credentials-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}-${{ strategy.job-index }}"
          printf 'https://x-access-token:%s@github.com\n' "${UNIVERSE_GITHUB_READ_TOKEN}" > "${credentials_file}"
          {
            echo "UNIVERSE_GIT_CREDENTIALS_FILE=${credentials_file}"
            echo "GIT_CONFIG_COUNT=2"
            # An empty helper first resets any helper inherited for github.com.
            echo "GIT_CONFIG_KEY_0=credential.https://github.com.helper"
            echo "GIT_CONFIG_VALUE_0="
            echo "GIT_CONFIG_KEY_1=credential.https://github.com.helper"
            echo "GIT_CONFIG_VALUE_1=store --file=${credentials_file}"
          } >> "${GITHUB_ENV}"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install test runner
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: ${{ matrix.test-config.name }}
        run: ${{ matrix.test-config.command }}
      - name: Remove dependency credentials
        if: always()
        run: |
          # Only this job's own file. Global git configuration is never read or
          # changed here, so a concurrent job is never affected.
          if [ -n "${UNIVERSE_GIT_CREDENTIALS_FILE:-}" ]; then
            rm -f "${UNIVERSE_GIT_CREDENTIALS_FILE}"
          fi
