name: Rust

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

env:
  CARGO_TERM_COLOR: always
  CARGO_NET_GIT_FETCH_WITH_CLI: "true"
  # build.rs generates the src/tests/std/*_build.rs fixtures for EVERY
  # alkanes-std-* crate only when some environment variable name contains
  # "ALL" (see the vars_os().position(...contains("ALL")) check). GitHub's
  # hosted images satisfied that by accident (GHCUP_INSTALL_BASE_PREFIX);
  # the RunsOn image does not, which left 9 fixture modules ungenerated
  # (E0583). Set it explicitly so fixture generation is runner-agnostic.
  ALKANES_BUILD_ALL_FIXTURES: "1"

jobs:
  route:
    uses: ./.github/workflows/route.yml
    secrets: inherit
    with:
      plan: '{"test":"light"}'
      config_ref: 1dd19289af21f4f6be01f874390a180b3af8bb38

  test:
    needs: route
    runs-on: ${{ fromJSON(needs.route.outputs.targets).test }}
    strategy:
      matrix:
        test-config:
          - name: "WASM Tests"
            command: "cargo test --target wasm32-unknown-unknown --features test-utils"
          - name: "Protorunes WASM Tests"
            command: "cargo test -p protorune --features test-utils"
          - name: "Protorune Unit Tests"
            command: "cargo test -p protorune --target x86_64-unknown-linux-gnu"
      fail-fast: false # Allows all tests to run even if one fails

    name: ${{ matrix.test-config.name }}
    steps:
      - uses: actions/checkout@v4
      - name: Authenticate private Universe dependencies
        env:
          UNIVERSE_GITHUB_READ_TOKEN: ${{ secrets.UNIVERSE_GITHUB_READ_TOKEN }}
        run: |
          test -n "${UNIVERSE_GITHUB_READ_TOKEN}"
          credentials_file="${RUNNER_TEMP}/universe-git-credentials"
          printf 'https://x-access-token:%s@github.com\n' "${UNIVERSE_GITHUB_READ_TOKEN}" > "${credentials_file}"
          chmod 600 "${credentials_file}"
          git config --global credential.helper "store --file=${credentials_file}"
      - name: Install protoc
        run: sudo apt-get update && sudo apt-get install -y protobuf-compiler
      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: wasm32-unknown-unknown
      - name: Install test runner
        run: cargo install wasm-bindgen-cli --version 0.2.100 --locked
      - name: ${{ matrix.test-config.name }}
        run: ${{ matrix.test-config.command }}
      - name: Remove dependency credentials
        if: always()
        run: |
          rm -f "${RUNNER_TEMP}/universe-git-credentials"
          git config --global --unset-all credential.helper || true
